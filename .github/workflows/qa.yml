name: Reel kit QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Render key storyboard frames
        run: |
          npm run preview -- gradient-descent 0 1.4 2.4 3.9 9.9 14.5 19.5 23.5 27 28.3 30.5 32.3 37 39.8 42.6
          npm run preview -- attention-bank 26 28.2 32 44 45.3 46.9
      - name: Render motion-review video (half size, with the mastered mix)
        run: |
          mkdir -p out/review
          npx remotion render GradientDescent out/review/gradient-descent-review.mp4 --scale=0.5 --codec=h264 --crf=22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-motion-review
          path: out/review/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-frame-preview
          path: out/preview/
          if-no-files-found: warn
          retention-days: 7
